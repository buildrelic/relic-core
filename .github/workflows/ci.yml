name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relic
          POSTGRES_PASSWORD: relic
          POSTGRES_DB: relic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync workspace dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check
      - name: Pyright
        run: uv run python -m pyright
      - name: Import contracts
        run: uv run lint-imports
      - name: Pytest
        run: uv run python -m pytest
        env:
          DATABASE_URL: postgresql://relic:relic@localhost:5432/relic
