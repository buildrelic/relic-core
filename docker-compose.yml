services:
  postgres:
    image: postgres:16-alpine
    container_name: relic-postgres
    environment:
      POSTGRES_USER: relic
      POSTGRES_PASSWORD: relic
      POSTGRES_DB: relic
    ports:
      - "5432:5432"   # the engram store (DATABASE_URL)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: "no"
    # `docker compose up -d --wait` blocks on this before returning.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relic -d relic"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
