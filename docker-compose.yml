services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: relic-falkordb
    ports:
      - "6379:6379"   # graph / Redis protocol (FALKORDB_PORT)
      - "3000:3000"   # FalkorDB Browser UI at http://localhost:3000
    volumes:
      - falkordb-data:/data
    restart: unless-stopped

volumes:
  falkordb-data:
