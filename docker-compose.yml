services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: relic-falkordb
    ports:
      - "6379:6379"   # graph / Redis protocol (FALKORDB_PORT)
      - "3000:3000"   # FalkorDB Browser UI at http://localhost:3000
    volumes:
      - falkordb-data:/data
    restart: "no"
    # FalkorDB speaks the Redis protocol, so a PING is enough to call it ready.
    # `docker compose up -d --wait` blocks on this before returning.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  falkordb-data:
