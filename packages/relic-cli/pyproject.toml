[project]
name = "relic-cli"
version = "0.0.1"
description = "Relic CLI: the composition root that wires ingest, graph, and serve. Owner: Zidan."
requires-python = ">=3.12,<3.13"
authors = [{ name = "buildrelic" }]
dependencies = [
    "relic-core",
    "relic-ingest",
    "relic-graph",
    "relic-serve",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.11.5",
    # ASGI server for `relic serve-http` (the web app's recall API).
    "uvicorn>=0.30",
]

[project.scripts]
relic = "relic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic"]

[tool.uv.sources]
relic-core = { workspace = true }
relic-ingest = { workspace = true }
relic-graph = { workspace = true }
relic-serve = { workspace = true }
