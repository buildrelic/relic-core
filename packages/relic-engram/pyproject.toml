[project]
name = "relic-graph"
version = "0.0.1"
description = "Relic memory/retrieval store: Graphiti graph, recall, procedure detection and compilation. Owner: Abhinav."
requires-python = ">=3.12,<3.13"
authors = [{ name = "buildrelic" }]
dependencies = [
    "relic-core",
    "graphiti-core[falkordb,google-genai]>=0.29.1,<0.30",
    "tenacity>=9.0.0",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic"]

[tool.uv.sources]
relic-core = { workspace = true }
