[project]
name = "relic-engram"
version = "0.0.1"
description = "Relic memory store: Postgres engram, recall, procedure detection and compilation. Owner: Abhinav."
requires-python = ">=3.12,<3.13"
authors = [{ name = "buildrelic" }]
dependencies = [
    "relic-core",
    "asyncpg>=0.29",
    "firebase-admin>=6.5",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic"]

[tool.uv.sources]
relic-core = { workspace = true }
