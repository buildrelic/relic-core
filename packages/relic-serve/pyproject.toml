[project]
name = "relic-serve"
version = "0.0.1"
description = "Relic serve: FastMCP server, skill registry, emit to .claude/skills, SKILL.md render. Owner: Zidan."
requires-python = ">=3.12,<3.13"
authors = [{ name = "buildrelic" }]
dependencies = [
    "relic-core",
    "fastmcp>=3,<4",
    "jinja2>=3.1",
    # Thin HTTP surface for the web app (relic/serve/http_server.py). Starlette
    # ships under fastmcp already; declared here because we import it directly.
    "starlette>=0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ships the Jinja SKILL.md template (relic/serve/templates/skill.md.j2) alongside
# the code, so render works wherever the package is installed.
[tool.hatch.build.targets.wheel]
packages = ["src/relic"]

[tool.uv.sources]
relic-core = { workspace = true }
