# Relic is a uv workspace. Three engineers own three subsystems; a shared core
# holds the interface contracts. Each package declares its own dependencies, so a
# package can import another only if it depends on it, and only that package's
# public API. The dependency graph is the interface contract. See AGENTS.md.
#
#   relic-core            shared: contracts, ontology, config, obs   (jointly owned)
#     ^      ^      ^
#   ingest  graph  serve   each depends on relic-core only; mutually independent
#     ^      ^      ^
#          relic-cli       composition root: depends on all three + core
#
# Owners: ingest = Paris, graph = Abhinav, serve + cli = Zidan, core = all.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "syrupy>=4.7",
    "pre-commit>=3.8",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/relic-core/src",
    "packages/relic-ingest/src",
    "packages/relic-graph/src",
    "packages/relic-serve/src",
    "packages/relic-cli/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["relic"]

[tool.ruff.lint.per-file-ignores]
# Ported verbatim from the system-design doc; keep Optional[...] (UP off).
"packages/relic-core/src/relic/ontology/skill_ir.py" = ["UP"]

[tool.pyright]
include = ["packages", "tests"]
extraPaths = [
    "packages/relic-core/src",
    "packages/relic-ingest/src",
    "packages/relic-graph/src",
    "packages/relic-serve/src",
    "packages/relic-cli/src",
]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# import-linter is belt-and-suspenders: the package dependency graph already
# prevents cross-subsystem imports by construction, but these contracts catch an
# accidental edge before someone declares the dependency that would allow it.
[tool.importlinter]
root_package = "relic"

[[tool.importlinter.contracts]]
name = "ingest, graph, serve are independent siblings"
type = "independence"
modules = [
    "relic.ingest",
    "relic.graph",
    "relic.serve",
]

[[tool.importlinter.contracts]]
name = "subsystems never import the composition root"
type = "forbidden"
source_modules = [
    "relic.ingest",
    "relic.graph",
    "relic.serve",
]
forbidden_modules = ["relic.cli"]
