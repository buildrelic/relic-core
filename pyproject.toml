[project]
name = "relic"
version = "0.0.1"
description = "Memory layer for AI-native teams, built on Graphiti."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "buildrelic" }]
dependencies = [
    "graphiti-core[falkordb,google-genai]>=0.29.1,<0.30",
    "fastmcp>=3,<4",
    "pydantic>=2.11.5",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "jinja2>=3.1",
    "githubkit>=0.11",
    "gql[httpx]>=3.5",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
]

[project.scripts]
relic = "relic.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "syrupy>=4.7",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/relic/ontology/skill_ir.py" = ["UP"]  # ported verbatim, keep Optional[...]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
